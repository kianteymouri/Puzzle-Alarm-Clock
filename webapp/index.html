<h1>Alarm Manager</h1>

<input type="time" id="alarmTime">

<select id="modeSelect">
  <option value="easy">Calendar Empty</option>
  <option value="boss">My boss will kill me</option>
  <option value="puzzle">I love puzzles</option>
</select>

<button onclick="addAlarm()">Add</button>

<ul id="alarmList"></ul>

<script>
async function loadAlarms() {
  const res = await fetch('/api/alarms');
  const data = await res.json();

  const list = document.getElementById('alarmList');
  list.innerHTML = '';

  data.alarms.forEach(a => {
    const li = document.createElement('li');
    li.textContent = `${a.time} (${a.mode})`;

    const btn = document.createElement('button');
    btn.textContent = 'Delete';
    btn.onclick = async () => {
      await fetch(`/api/alarms/${a.time}`, {method:'DELETE'});
      loadAlarms();
    };

    li.appendChild(btn);
    list.appendChild(li);
  });
}

async function addAlarm() {
  const time = document.getElementById('alarmTime').value;
  const mode = document.getElementById('modeSelect').value;

  await fetch('/api/alarms', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({time, mode})
  });

  loadAlarms();
}

loadAlarms();
</script>
